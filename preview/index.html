<!doctype html>
<html lang="en" data-font="serif" data-effects="full">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover here, on purpose: the page then stays inside the phone's safe area, so the app's own safe-area padding has nothing to add. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c1e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Cyphor is a calm workspace for thinking with an LLM." />
    <!-- The same mark as app/icon.svg, written out so the build stays one file. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23166657'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23f5f3ee' stroke-width='2.4' stroke-dasharray='1.5 2.07'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23f5f3ee'/%3E%3C/svg%3E"
    />
    <title>Cyphor Chat</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
